{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Lemon</title>
    <link rel="stylesheet" href="{% static 'restaurant/style.css' %}">
</head>
<body>
    <header>
        <img src="{% static 'restaurant/logo.png' %}" alt="Little Lemon Logo">
    </header>

    <nav>
        <ul>
            <li><a href="{% url 'index' %}">Home</a></li>
            <li><a href="{% url 'book' %}">Book</a></li>
            <li><a href="{% url 'reservations' %}">Reservations</a></li>
            <li><a href="{% url 'menu-list' %}">Menu</a></li>
        </ul>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; Little Lemon Restaurant</p>
    </footer>
</body>
</html>
